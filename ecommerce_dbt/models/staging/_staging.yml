version: 2

models:
  - name: staging_orders
    columns:
      - name: order_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['approving', 'approved', 'shipping', 'delivered', 'canceled', 'unavailable', 'invoiced', 'processing']

  - name: staging_order_items
    columns:
      - name: order_id
        tests:
          - not_null
      - name: order_item_id
        tests:
          - not_null
      - name: price
        tests:
          - not_null
      - name: freight_value
        tests:
          - not_null

  - name: staging_order_payments
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_sequential
        tests:
          - not_null
      - name: payment_type
        tests:
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']

  - name: staging_order_reviews
    columns:
      - name: review_id
        tests:
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: review_score
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]

  - name: staging_customers
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: customer_unique_id
        tests:
          - not_null

  - name: staging_products
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: staging_sellers
    columns:
      - name: seller_id
        tests:
          - not_null
          - unique

  - name: staging_geolocation
    columns:
      - name: zip_code
        tests:
          - not_null
          - unique
